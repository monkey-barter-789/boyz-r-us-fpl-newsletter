<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOYZ R US Weekly — this gameweek's edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="landing">
  <h1>BOYZ R US Weekly</h1>
  <div class="tagline">This page always shows the current gameweek's edition — bookmark it, share it once, done.</div>
  <form id="league-form">
    <input type="text" id="league-code" placeholder="e.g. 1224623" inputmode="numeric" value="1224623" required>
    <button type="submit">Refresh This Week's Paper</button>
  </form>
  <div class="hint">
    Loads automatically. Change the code above only if you want a different league's edition.
  </div>
  <div id="status"></div>
  <div id="share-row" class="share-row" style="display:none;">
    <button id="share-whatsapp" type="button">Share to WhatsApp</button>
    <button id="share-copy" type="button">Copy Link</button>
    <button id="export-pdf" type="button">Export to PDF</button>
  </div>
</div>

<div id="result"></div>

<script src="app.js"></script>
</body>
</html>
